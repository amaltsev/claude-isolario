<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isolario</title>
<style>/*PAGE_CSS*/</style>
<style>
.masthead {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.4rem 1.6rem;
  max-width: 1560px;
  margin: 0 auto;
  padding: 1.4rem 1.5rem 0;
}
.masthead h1 {
  margin: 0;
  font-size: 1.5rem;
  font-weight: normal;
  letter-spacing: 0.3em;
  text-transform: uppercase;
}
.masthead p { margin: 0; font-style: italic; color: var(--muted); }
.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.6rem;
  max-width: 1560px;
  margin: 0 auto;
  padding: 1rem 1.5rem 0;
}
.controls label { font-variant: small-caps; letter-spacing: 0.08em; color: var(--muted); }
.controls input {
  flex: 1 1 12rem;
  min-width: 0;
  max-width: 22rem;
  padding: 0.45rem 0.7rem;
  font: inherit;
  color: var(--ink);
  background: var(--page);
  border: 1px solid var(--rule);
  border-radius: 2px;
}
.controls button {
  padding: 0.45rem 0.95rem;
  font: inherit;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--muted);
  border-radius: 2px;
  cursor: pointer;
}
.controls button.primary { background: var(--ink); color: var(--page); border-color: var(--ink); }
.controls button:hover { border-color: var(--accent); color: var(--accent); }
.controls button.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--page); }
.controls input:focus-visible, .controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.controls .spacer { flex: 1 1 0; }
.status { min-width: 5.5rem; font-style: italic; color: var(--muted); }
.entry.busy { opacity: 0.45; transition: opacity 0.15s; }
.colophon {
  max-width: 1560px;
  margin: 0 auto;
  padding: 0 1.5rem 2rem;
  font-size: 0.9rem;
  font-style: italic;
  color: var(--muted);
}
.colophon kbd { font: inherit; font-style: normal; border: 1px solid var(--rule); border-radius: 2px; padding: 0 0.3em; }
@media (max-width: 920px) {
  .masthead, .controls { padding-inline: 1rem; }
  .colophon { padding-inline: 1rem; }
  .controls .spacer { display: none; }
}
@media print { .masthead, .controls, .colophon { display: none; } }
</style>
</head>
<body>
<header class="masthead">
  <h1>Isolario</h1>
  <p>a book of islands that do not exist</p>
</header>
<form class="controls" id="controls">
  <label for="seed">Seed</label>
  <input id="seed" name="seed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="any words at all">
  <button class="primary" type="submit">Chart it</button>
  <button type="button" id="another">Another island</button>
  <span class="spacer"></span>
  <span class="status" id="status" role="status" aria-live="polite"></span>
  <button type="button" id="copy">Copy link</button>
  <button type="button" id="save-map">Download map</button>
  <button type="button" id="save-text">Download text</button>
</form>
<main class="entry" id="entry"></main>
<footer class="colophon">
  Every island is grown from its seed: the same words always give the same chart, the same towns, the same
  wreck off the same shore. Press <kbd>n</kbd> for another island. The maps and texts made here are free to use for anything, and need no credit.
</footer>
<script>
/*BUNDLE*/
</script>
<script>
(() => {
  const { generateIsland, renderSVG, entryHTML, gazetteerMarkdown, randomSeed } = Isolario;
  const entry = document.getElementById('entry');
  const input = document.getElementById('seed');
  const status = document.getElementById('status');
  let current = null;
  let statusTimer = 0;

  const say = (message) => {
    status.textContent = message;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { status.textContent = ''; }, 2400);
  };

  const seedFromHash = () => {
    const raw = location.hash.slice(1);
    if (!raw) return null;
    try {
      return decodeURIComponent(raw) || null;
    } catch {
      return raw;
    }
  };

  let pending = 0;
  function draw(seed) {
    const island = generateIsland(seed);
    const svg = renderSVG(island);
    entry.innerHTML = entryHTML(island, svg);
    entry.classList.remove('busy');
    const name = island.name.full.replace(/^the /, 'The ');
    document.title = `${name} · Isolario`;
    current = { seed, svg, island };
  }
  function show(seed, immediately = false) {
    input.value = seed;
    clearTimeout(pending);
    if (immediately) {
      draw(seed);
      return;
    }
    // A short timer lets the dimmed state paint before the survey blocks
    // the thread. (Not requestAnimationFrame: that never fires in a tab
    // opened in the background, and the page would sit empty.)
    entry.classList.add('busy');
    pending = setTimeout(() => draw(seed), 30);
  }

  function go(seed, replace = false) {
    const hash = `#${encodeURIComponent(seed)}`;
    if (replace) history.replaceState(null, '', hash);
    else if (location.hash !== hash) history.pushState(null, '', hash);
    show(seed, replace);
  }

  document.getElementById('controls').addEventListener('submit', (event) => {
    event.preventDefault();
    go(input.value.trim() || randomSeed());
  });
  document.getElementById('another').addEventListener('click', () => go(randomSeed()));
  document.getElementById('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(location.href);
      say('Link copied');
    } catch {
      say('Copy it from the address bar');
    }
  });
  // The map is the chart as drawn (SVG); the text is its entry (Markdown).
  const download = (extension, type, contents, done) => {
    if (!current) return;
    const slug = current.seed.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'island';
    const url = URL.createObjectURL(new Blob([contents(current)], { type }));
    const link = document.createElement('a');
    link.href = url;
    link.download = `isolario-${slug}.${extension}`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    say(done);
  };
  document.getElementById('save-map').addEventListener('click', () => {
    download('svg', 'image/svg+xml', (c) => c.svg, 'Map saved');
  });
  document.getElementById('save-text').addEventListener('click', () => {
    // A copy served from the web can point back at itself; one opened from
    // a file has no address worth writing down.
    const link = /^https?:$/.test(location.protocol) ? location.href : undefined;
    download('md', 'text/markdown', (c) => gazetteerMarkdown(c.island, { link }), 'Text saved');
  });
  document.addEventListener('keydown', (event) => {
    if (event.key !== 'n' || event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.target instanceof HTMLInputElement || event.target instanceof HTMLButtonElement) return;
    go(randomSeed());
  });
  window.addEventListener('popstate', () => show(seedFromHash() ?? randomSeed()));

  go(seedFromHash() ?? randomSeed(), true);
})();
</script>
</body>
</html>
